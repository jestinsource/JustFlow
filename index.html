<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeFlow — Typing Speed Test</title>
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background: #0a0e1a;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(108, 140, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(125, 255, 179, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(20, 30, 60, 0.4) 0%, transparent 80%);
        }

        /* ----- MAIN CARD ----- */
        .app-card {
            background: rgba(16, 22, 42, 0.75);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: 3rem;
            padding: 2.8rem 3.2rem;
            max-width: 860px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 0 60px rgba(108, 140, 255, 0.03);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(108, 140, 255, 0.03), transparent 60%);
            pointer-events: none;
        }

        /* ----- HEADER ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.2rem;
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.7rem;
            font-weight: 700;
            color: #e8edff;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            font-size: 1.9rem;
            filter: drop-shadow(0 0 12px rgba(108, 140, 255, 0.3));
        }

        .logo span {
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats {
            display: flex;
            gap: 2rem;
            background: rgba(10, 14, 30, 0.5);
            padding: 0.5rem 1.8rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-icon {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .stat-label {
            color: #7a89b5;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .stat-value {
            color: #f0f4ff;
            font-size: 1.25rem;
            font-weight: 700;
            min-width: 2.6rem;
            text-align: right;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, #e8edff, #b8c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ----- TEXT DISPLAY ----- */
        .text-display {
            background: rgba(8, 12, 28, 0.6);
            border-radius: 1.8rem;
            padding: 2rem 2.2rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow:
                inset 0 4px 20px rgba(0, 0, 0, 0.5),
                0 8px 32px rgba(0, 0, 0, 0.2);
            min-height: 110px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1;
            transition: border-color 0.3s ease;
        }

        .text-display:focus-within {
            border-color: rgba(108, 140, 255, 0.2);
        }

        #textToType {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 2.2rem;
            color: #5a6a92;
            letter-spacing: 0.3px;
            word-break: break-word;
            font-family: 'Inter', 'Segoe UI', monospace;
        }

        #textToType .correct {
            color: #7dffb3;
            text-shadow: 0 0 20px rgba(125, 255, 179, 0.15);
            background: rgba(125, 255, 179, 0.06);
            border-radius: 2px;
            padding: 0 1px;
        }

        #textToType .incorrect {
            color: #ff7a7a;
            text-shadow: 0 0 20px rgba(255, 122, 122, 0.15);
            background: rgba(255, 122, 122, 0.08);
            border-radius: 2px;
            padding: 0 1px;
        }

        #textToType .current {
            border-bottom: 3px solid #6c8cff;
            padding-bottom: 1px;
            animation: cursorPulse 1s ease-in-out infinite;
            color: #c8d4ff;
        }

        @keyframes cursorPulse {
            0%,
            100% {
                border-color: #6c8cff;
                opacity: 1;
            }
            50% {
                border-color: rgba(108, 140, 255, 0.2);
                opacity: 0.6;
            }
        }

        /* ----- INPUT AREA ----- */
        .input-area {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        #userInput {
            flex: 1;
            background: rgba(8, 12, 28, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 3rem;
            padding: 1rem 2rem;
            font-size: 1.05rem;
            color: #e8edff;
            outline: none;
            transition: all 0.3s ease;
            min-width: 180px;
            font-family: 'Inter', 'Segoe UI', monospace;
            backdrop-filter: blur(8px);
        }

        #userInput::placeholder {
            color: #3a4a72;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        #userInput:focus {
            border-color: rgba(108, 140, 255, 0.4);
            box-shadow: 0 0 0 6px rgba(108, 140, 255, 0.06), 0 0 40px rgba(108, 140, 255, 0.03);
            background: rgba(8, 12, 28, 0.9);
        }

        #userInput:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .btn {
            background: rgba(20, 28, 56, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 3rem;
            padding: 1rem 2.2rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #b0c0ee;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            min-width: 120px;
            backdrop-filter: blur(8px);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c8cff, #7c6cff);
            color: #0a0e1a;
            border: none;
            font-weight: 700;
            box-shadow: 0 4px 24px rgba(108, 140, 255, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 40px rgba(108, 140, 255, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(20, 28, 56, 0.5);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(40, 52, 90, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-secondary:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn .btn-icon {
            font-size: 1.1rem;
        }

        /* ----- RESULT SECTION ----- */
        .result-area {
            background: rgba(8, 12, 28, 0.4);
            border-radius: 1.8rem;
            padding: 1.4rem 2rem;
            margin-top: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 1;
            min-height: 76px;
            transition: all 0.4s ease;
        }

        .result-area.has-results {
            border-color: rgba(108, 140, 255, 0.1);
            background: rgba(8, 12, 28, 0.6);
        }

        .result-message {
            font-size: 0.95rem;
            color: #8899c8;
            font-weight: 450;
            letter-spacing: 0.2px;
        }

        .result-message strong {
            color: #e8edff;
            font-weight: 600;
        }

        .result-message .highlight {
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-details {
            display: flex;
            gap: 2.2rem;
        }

        .result-detail-item {
            text-align: center;
            padding: 0.2rem 0.4rem;
        }

        .result-detail-item .value {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            font-variant-numeric: tabular-nums;
        }

        .result-detail-item .value.wpm {
            background: linear-gradient(135deg, #ffd966, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-detail-item .value.accuracy {
            background: linear-gradient(135deg, #7dffb3, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-detail-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #5a6a92;
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        .hidden {
            display: none !important;
        }

        /* ----- ANIMATED GLOW ORB ----- */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 {
            width: 300px;
            height: 300px;
            top: -120px;
            right: -80px;
            background: rgba(108, 140, 255, 0.06);
        }

        .glow-orb-2 {
            width: 200px;
            height: 200px;
            bottom: -60px;
            left: -60px;
            background: rgba(125, 255, 179, 0.04);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 700px) {
            .app-card {
                padding: 1.8rem 1.5rem;
                border-radius: 2rem;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .logo {
                justify-content: center;
                font-size: 1.5rem;
            }

            .stats {
                justify-content: space-around;
                padding: 0.5rem 1rem;
                gap: 0.5rem;
                width: 100%;
            }

            .stat-item {
                flex-direction: column;
                gap: 0.1rem;
            }

            .stat-value {
                font-size: 1.1rem;
                min-width: 2rem;
            }

            .text-display {
                padding: 1.2rem 1.2rem;
                min-height: 80px;
                border-radius: 1.2rem;
            }

            #textToType {
                font-size: 1.1rem;
                line-height: 1.8rem;
            }

            .input-area {
                flex-direction: column;
                gap: 0.6rem;
            }

            #userInput {
                width: 100%;
                text-align: center;
                padding: 0.9rem 1.2rem;
                font-size: 0.95rem;
            }

            .btn {
                width: 100%;
                min-width: unset;
                padding: 0.9rem 1.2rem;
            }

            .result-area {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 1.2rem 1.2rem;
                gap: 0.6rem;
            }

            .result-details {
                justify-content: space-around;
                gap: 1rem;
            }

            .result-detail-item .value {
                font-size: 1.3rem;
            }

            .glow-orb-1,
            .glow-orb-2 {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .app-card {
                padding: 1.2rem 0.8rem;
                border-radius: 1.5rem;
            }

            #textToType {
                font-size: 0.95rem;
                line-height: 1.6rem;
            }

            .stats {
                flex-wrap: wrap;
                gap: 0.3rem;
            }

            .stat-item {
                flex: 1;
                min-width: 60px;
            }
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(108, 140, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- Glow Orbs -->
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>

        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon">⌨️</span>
                <span>Type</span>Flow
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-icon">⏱️</span>
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timerDisplay">60</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">⌨️</span>
                    <span class="stat-label">Chars</span>
                    <span class="stat-value" id="charCount">0</span>
                </div>
            </div>
        </div>

        <!-- TEXT DISPLAY -->
        <div class="text-display">
            <div id="textToType">✨ Click <strong style="color:#6c8cff;">Start</strong> to begin your flow.</div>
        </div>

        <!-- INPUT + BUTTONS -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type here..." disabled autofocus />
            <button class="btn btn-primary" id="startBtn">
                <span class="btn-icon">▶</span> Start
            </button>
            <button class="btn btn-secondary" id="resetBtn">
                <span class="btn-icon">⟳</span> Reset
            </button>
        </div>

        <!-- RESULT AREA -->
        <div class="result-area" id="resultArea">
            <div class="result-message" id="resultMessage">
                🌊 Ready to flow with your typing?
            </div>
            <div class="result-details" id="resultDetails">
                <div class="result-detail-item">
                    <div class="value wpm" id="wpmResult">0</div>
                    <div class="label">WPM</div>
                </div>
                <div class="result-detail-item">
                    <div class="value accuracy" id="accuracyResult">0%</div>
                    <div class="label">Accuracy</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  TYPEFLOW — Full JavaScript
        // ============================================================

        // ----- SENTENCE BANK (more poetic & varied) -----
        const SENTENCES = [
            "The quiet hum of morning light spills across the waking earth.",
            "Every keystroke is a step toward mastery of your craft.",
            "Between the notes of silence, music finds its voice.",
            "To type is to dance with thought, each letter a gentle step.",
            "The horizon glows with the promise of a brand new day.",
            "In the realm of words, speed and grace become one.",
            "A steady rhythm turns chaos into a symphony of order.",
            "The mind imagines, the fingers follow, and magic unfolds.",
            "Typing is not mere motion, it is the poetry of intention.",
            "With patience and practice, even the impossible grows near.",
            "The stars above are not so distant as the dreams within.",
            "Let your fingers flow like water over ancient stones.",
            "Every mistake is a lesson wrapped in a gentle nudge.",
            "Speed is the child of accuracy, born from quiet focus.",
            "The screen glows, a portal to worlds yet to be written.",
            "Breathe, focus, and let your thoughts take flight.",
            "A single word can change the current of an entire day.",
            "The journey of a thousand miles begins with a single key.",
            "Typing fast is a dance, typing well is a masterpiece.",
            "The future belongs to those who can shape it with their hands."
        ];

        // ----- DOM REFS -----
        const textToTypeEl = document.getElementById('textToType');
        const userInput = document.getElementById('userInput');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const charCount = document.getElementById('charCount');
        const resultMessage = document.getElementById('resultMessage');
        const wpmResult = document.getElementById('wpmResult');
        const accuracyResult = document.getElementById('accuracyResult');
        const resultArea = document.getElementById('resultArea');

        // ----- STATE -----
        let targetText = '';
        let isRunning = false;
        let isFinished = false;
        let timer = 60;
        let timerInterval = null;
        let totalCorrectChars = 0;
        let totalTypedChars = 0;

        // ----- HELPERS -----

        function getRandomSentence() {
            return SENTENCES[Math.floor(Math.random() * SENTENCES.length)];
        }

        function renderText(userInputStr = '') {
            let html = '';
            const target = targetText;
            const inputLen = userInputStr.length;

            for (let i = 0; i < target.length; i++) {
                const targetChar = target[i];
                let charHtml = '';

                if (i < inputLen) {
                    const userChar = userInputStr[i];
                    if (userChar === targetChar) {
                        charHtml = `<span class="correct">${targetChar}</span>`;
                    } else {
                        charHtml = `<span class="incorrect">${targetChar}</span>`;
                    }
                } else if (i === inputLen && !isFinished) {
                    charHtml = `<span class="current">${targetChar}</span>`;
                } else {
                    charHtml = targetChar;
                }
                html += charHtml;
            }
            textToTypeEl.innerHTML = html;
        }

        function updateStats() {
            timerDisplay.textContent = Math.ceil(timer);
            charCount.textContent = totalTypedChars;
        }

        function calculateResults() {
            const minutes = (60 - timer) / 60;
            const wpm = minutes > 0 ? Math.round((totalCorrectChars / 5) / minutes) : 0;
            const accuracy = totalTypedChars > 0 ? Math.round((totalCorrectChars / totalTypedChars) * 100) : 100;
            return { wpm, accuracy };
        }

        function showResults() {
            const { wpm, accuracy } = calculateResults();
            wpmResult.textContent = wpm;
            accuracyResult.textContent = accuracy + '%';
            resultArea.classList.add('has-results');

            let emoji = '🌟';
            let msg = '';
            if (wpm >= 70 && accuracy >= 95) {
                emoji = '🏆';
                msg = 'Exceptional flow! You\'re a typing virtuoso.';
            } else if (wpm >= 50 && accuracy >= 90) {
                emoji = '🔥';
                msg = 'Great rhythm! You\'re building serious momentum.';
            } else if (wpm >= 35) {
                emoji = '🌊';
                msg = 'Steady flow! Keep practicing to ride the wave.';
            } else {
                emoji = '🌱';
                msg = 'Every master starts somewhere. Keep going!';
            }
            resultMessage.innerHTML =
                `${emoji} ${msg} <strong>${totalCorrectChars}</strong> correct chars.`;
        }

        // ----- CORE LOGIC -----

        function startTest() {
            if (isRunning) return;
            if (isFinished) resetTest();

            if (!targetText) {
                targetText = getRandomSentence();
                renderText('');
            }

            isRunning = true;
            isFinished = false;
            timer = 60;
            totalCorrectChars = 0;
            totalTypedChars = 0;

            userInput.disabled = false;
            userInput.value = '';
            userInput.focus();

            startBtn.disabled = true;
            startBtn.innerHTML = '<span class="btn-icon">⏳</span> Flowing...';

            resultMessage.textContent = '⏱️ Type the text above. Timer is running!';
            resultArea.classList.remove('has-results');
            wpmResult.textContent = '0';
            accuracyResult.textContent = '0%';

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer -= 0.1;
                if (timer <= 0) {
                    timer = 0;
                    finishTest();
                }
                updateStats();
            }, 100);

            updateStats();
            renderText('');
        }

        function finishTest() {
            if (!isRunning) return;

            isRunning = false;
            isFinished = true;
            clearInterval(timerInterval);
            timerInterval = null;

            userInput.disabled = true;
            startBtn.disabled = false;
            startBtn.innerHTML = '<span class="btn-icon">▶</span> Start';

            renderText(userInput.value);
            showResults();
            updateStats();
        }

        function resetTest() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isFinished = false;
            targetText = '';
            timer = 60;
            totalCorrectChars = 0;
            totalTypedChars = 0;

            userInput.disabled = true;
            userInput.value = '';
            startBtn.disabled = false;
            startBtn.innerHTML = '<span class="btn-icon">▶</span> Start';

            textToTypeEl.innerHTML = '✨ Click <strong style="color:#6c8cff;">Start</strong> to begin your flow.';
            timerDisplay.textContent = '60';
            charCount.textContent = '0';
            wpmResult.textContent = '0';
            accuracyResult.textContent = '0%';
            resultMessage.textContent = '🌊 Ready to flow with your typing?';
            resultArea.classList.remove('has-results');
        }

        function handleUserInput(e) {
            if (!isRunning || isFinished) return;

            const inputValue = e.target.value;
            const target = targetText;

            if (inputValue.length > target.length) {
                userInput.value = inputValue.slice(0, target.length);
                return;
            }

            totalTypedChars = inputValue.length;
            let correct = 0;
            for (let i = 0; i < inputValue.length; i++) {
                if (inputValue[i] === target[i]) correct++;
            }
            totalCorrectChars = correct;

            renderText(inputValue);

            if (inputValue.length === target.length) {
                finishTest();
            }

            updateStats();
        }

        // ----- EVENT LISTENERS -----

        startBtn.addEventListener('click', startTest);
        resetBtn.addEventListener('click', resetTest);
        userInput.addEventListener('input', handleUserInput);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isRunning && !isFinished) {
                startTest();
            }
            if (e.key === 'Escape') {
                resetTest();
            }
        });

        // Initial state
        resetTest();
    </script>
</body>
</html>
